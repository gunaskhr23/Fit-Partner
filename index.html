<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fit Partner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg:#0A0B0D; --bg-alt:#0D0F12; --panel:rgba(255,255,255,0.045); --panel-solid:#14161A;
    --border:rgba(255,255,255,0.09); --border-strong:rgba(255,255,255,0.16);
    --text:#EDEEF0; --muted:#8A8F98;
    --lime:#C8FF4D; --lime-dim:rgba(200,255,77,0.35); --blue:#5B7CFA; --red:#FF4D5E; --bubble-user:#1D2026;
    --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',system-ui,sans-serif;
    --glow-o:0.35; --glow-s:1;
    --orb-size: clamp(120px, 30vw, 172px);
  }
  :root:not([data-theme="light"]){ color-scheme: dark; }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F5F6F8; --bg-alt:#EFF0F3; --panel:rgba(10,11,13,0.04); --panel-solid:#FFFFFF;
      --border:rgba(10,11,13,0.09); --border-strong:rgba(10,11,13,0.18);
      --text:#14161A; --muted:#6B7078; --bubble-user:#EAEBEE;
    }
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  body{
    background:
      radial-gradient(circle at 50% 0%, var(--bg-alt) 0%, var(--bg) 55%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.012) 0 2px, transparent 2px 34px);
    color:var(--text); font-family:var(--font-body);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    overflow:hidden;
    width:100%;
    display:flex; justify-content:center; align-items:stretch;
  }
  ::selection{ background:var(--lime-dim); color:var(--text); }

  .app{
    flex:0 1 auto; width:100%; max-width:600px; margin:0 auto; display:flex; flex-direction:column;
    padding: clamp(12px,3vw,18px) clamp(12px,4vw,16px) clamp(10px,2.5vw,14px);
    position:relative;
  }

  header{display:flex; align-items:center; justify-content:space-between; padding-bottom:12px; flex-shrink:0;}
  .header-actions{ display:flex; align-items:center; gap:10px; }
  .brand{
    font-family:var(--font-display); font-weight:700; font-size:clamp(18px,4.5vw,20px);
    letter-spacing:-0.01em; display:flex; align-items:baseline; gap:6px;
  }
  .brand::after{
    content:'YOUR FIT PARTNER'; font-family:var(--font-body); font-weight:600; font-size:9px;
    letter-spacing:.14em; color:var(--muted); align-self:center; opacity:.7;
  }
  .live{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted);}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--lime); box-shadow:0 0 8px var(--lime); flex-shrink:0;}
  .pulse-line{width:30px; height:12px; opacity:.55;}
  .pulse-line path{ stroke:var(--lime); fill:none; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:48; stroke-dashoffset:0; animation:pulseTravel 2.4s linear infinite; }
  @keyframes pulseTravel{ from{stroke-dashoffset:96;} to{stroke-dashoffset:0;} }

  .history-btn{
    width:32px; height:32px; border-radius:50%; border:1px solid var(--border); background:var(--panel);
    color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:color .15s ease, border-color .15s ease, background .15s ease, transform .12s ease;
  }
  .history-btn svg{width:16px; height:16px;}
  .history-btn:hover{ color:var(--lime); border-color:var(--lime-dim); background:rgba(200,255,77,0.08); }
  .history-btn:active{ transform:scale(0.93); }
  .history-btn.open{ color:var(--lime); border-color:var(--lime-dim); }

  .history-panel{
    position:absolute; top:56px; right:0; width:min(280px, 84vw); max-height:60vh;
    background:var(--panel-solid); border:1px solid var(--border); border-radius:16px;
    box-shadow:0 12px 32px rgba(0,0,0,0.35); backdrop-filter:blur(10px);
    display:flex; flex-direction:column; overflow:hidden; z-index:20;
    opacity:0; transform:translateY(-6px) scale(0.98); pointer-events:none;
    transition:opacity .16s ease, transform .16s ease;
  }
  .history-panel.open{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .history-head{
    display:flex; align-items:center; justify-content:space-between; padding:12px 14px;
    border-bottom:1px solid var(--border); font-size:13px; font-weight:600;
  }
  .history-clear{
    background:none; border:none; color:var(--muted); font-size:12px; cursor:pointer; padding:2px 4px;
    transition:color .15s ease;
  }
  .history-clear:hover{ color:var(--text); }
  .history-list{ overflow-y:auto; padding:6px; }
  .history-item{
    display:flex; flex-direction:column; gap:2px; width:100%; text-align:left; background:none; border:none;
    color:var(--text); font-family:inherit; font-size:13px; padding:9px 10px; border-radius:10px; cursor:pointer;
    transition:background .15s ease;
  }
  .history-item:hover{ background:var(--panel); }
  .history-item .h-time{ font-size:11px; color:var(--muted); }
  .history-empty{ display:none; padding:18px 16px; font-size:12.5px; color:var(--muted); text-align:center; }
  .history-panel.empty .history-empty{ display:block; }
  .history-panel.empty .history-list{ display:none; }

  .orb-zone{display:flex; flex-direction:column; align-items:center; padding:4px 0 12px; flex-shrink:0; position:relative;}
  .orb-stage{
    position:relative; width:var(--orb-size); height:var(--orb-size);
    display:flex; align-items:center; justify-content:center;
  }
  .orb-glow{
    position:absolute; inset:-30%; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, color-mix(in srgb, var(--orb-color, var(--lime)) 55%, transparent) 0%, transparent 68%);
    opacity:calc(var(--glow-o) * 0.9); transform:scale(var(--glow-s));
    filter:blur(2px); transition:opacity .18s ease;
  }
  .orb-stage:hover .orb-glow{ opacity:calc(var(--glow-o) + 0.25); }
  #orbCanvas{
    position:relative; z-index:1; width:100%; height:100%; cursor:pointer; touch-action:none;
    transition:filter .2s ease;
  }
  .orb-stage:hover #orbCanvas{ filter:brightness(1.08); }
  .orb-ring{
    position:absolute; inset:6%; border-radius:50%; border:1px solid var(--border);
    pointer-events:none; opacity:0; transition:opacity .25s ease, transform .25s ease;
  }
  .orb-stage:hover .orb-ring{ opacity:1; transform:scale(1.04); border-color:var(--border-strong); }
  .orb-hint{font-size:12.5px; color:var(--muted); margin-top:8px; min-height:16px; text-align:center; transition:color .2s;}

  .messages{
    flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding:6px 2px 14px;
    -webkit-overflow-scrolling:touch;
  }
  .row{display:flex; flex-direction:column; max-width:84%; animation:rise .28s ease both;}
  @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .row.user{align-self:flex-end; align-items:flex-end;}
  .row.coach{align-self:flex-start; align-items:flex-start;}

  .bubble{
    padding:12px 15px; border-radius:18px; font-size:14.5px; line-height:1.55;
    backdrop-filter:blur(10px); transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .row.user .bubble{background:var(--bubble-user); border-bottom-right-radius:5px;}
  .row.coach .bubble{background:var(--panel); border:1px solid var(--border); border-bottom-left-radius:5px;}
  .row.coach .bubble:hover{ border-color:var(--border-strong); box-shadow:0 4px 18px rgba(0,0,0,0.22); }
  .row.user .bubble:hover{ transform:translateY(-1px); }

  .tags{display:flex; flex-wrap:wrap; gap:7px; margin-top:10px;}
  .tag{
    display:flex; align-items:center; gap:5px; font-size:12px; padding:5px 10px 5px 6px;
    border-radius:100px; border:1px solid var(--border); color:var(--muted);
    transition:border-color .15s ease, color .15s ease, transform .15s ease, background .15s ease;
  }
  .tag svg{width:14px; height:14px; flex-shrink:0;}
  .tag.muscle{border-color:rgba(200,255,77,0.35); color:var(--lime);}
  .tag.muscle:hover{ background:rgba(200,255,77,0.1); transform:translateY(-1px); border-color:var(--lime); }
  .tag.equip{border-color:rgba(91,124,250,0.4); color:var(--blue);}
  .tag.equip:hover{ background:rgba(91,124,250,0.12); transform:translateY(-1px); border-color:var(--blue); }

  .bodymap{display:flex; gap:20px; margin-top:12px; padding:14px; background:rgba(0,0,0,0.18); border-radius:12px; justify-content:center;}
  .bodymap-fig{display:flex; flex-direction:column; align-items:center; gap:5px;}
  .bodymap-fig svg{width:64px; height:auto;}
  .bodymap-fig .label{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em;}
  .bodymap-neutral{fill:#22252C; stroke:var(--border); stroke-width:0.5;}
  .bodymap-region{fill:#2E323B; stroke:#0A0B0D; stroke-width:0.6; transition:fill .25s;}
  .bodymap-region.hit{fill:var(--red); filter:drop-shadow(0 0 3px rgba(255,77,94,0.55));}

  .mealplan{margin-top:12px; display:flex; flex-direction:column; gap:6px;}
  .meal-row{display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:9px 12px; background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:10px;}
  .meal-row .meal-name{font-size:12px; font-weight:600; color:var(--lime); text-transform:uppercase; letter-spacing:.04em; flex-shrink:0;}
  .meal-row .meal-items{font-size:13px; color:var(--text); flex:1;}
  .meal-row .meal-cal{font-size:11.5px; color:var(--muted); flex-shrink:0;}

  .replay{
    margin-top:9px; font-size:12px; color:var(--muted); background:none; border:1px solid transparent;
    cursor:pointer; display:flex; align-items:center; gap:5px; padding:4px 8px 4px 6px; border-radius:100px;
    transition:color .15s ease, background .15s ease, border-color .15s ease;
  }
  .replay:hover{color:var(--lime); background:rgba(200,255,77,0.08); border-color:var(--lime-dim);}
  .replay svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:1.8;}

  .typing{display:flex; gap:4px; padding:3px 1px;}
  .typing span{width:6px; height:6px; border-radius:50%; background:var(--muted); animation:blink 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.2s;} .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}

  .inputbar{
    display:flex; align-items:center; gap:8px; background:var(--panel);
    border:1px solid var(--border); border-radius:16px; padding:8px 8px 8px 16px;
    backdrop-filter:blur(10px); flex-shrink:0;
    transition:border-color .18s ease, box-shadow .18s ease;
  }
  .inputbar:focus-within{ border-color:var(--lime-dim); box-shadow:0 0 0 3px rgba(200,255,77,0.08); }
  .inputbar input{
    flex:1; background:none; border:none; outline:none; color:var(--text);
    font-size:14.5px; font-family:inherit; min-width:0;
  }
  .inputbar input::placeholder{color:var(--muted);}
  .send{
    width:38px; height:38px; border-radius:50%; border:none; cursor:pointer; flex-shrink:0;
    background:var(--lime); display:flex; align-items:center; justify-content:center;
    transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  .send:hover{ transform:scale(1.06); box-shadow:0 0 0 6px rgba(200,255,77,0.12); }
  .send:active{transform:scale(0.93);}
  .send svg{width:17px; height:17px; stroke:#0A0B0D; fill:none; stroke-width:2;}

  .status{font-size:12px; color:var(--muted); text-align:center; padding:3px 0 8px; min-height:14px;}

  ::-webkit-scrollbar{width:5px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:10px; transition:background .15s;}
  ::-webkit-scrollbar-thumb:hover{background:var(--border-strong);}

  @media (max-width:360px){ .brand::after{ display:none; } }

  @media (min-width:760px){
    .app{ max-width:640px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Fit Partner</div>
    <div class="header-actions">
      <div class="live" title="Local model active">
        <svg class="pulse-line" viewBox="0 0 48 16"><path d="M0 8h9l3-6 4 12 3-9 2 3h27"/></svg>
        <span class="dot"></span>
      </div>
      <button class="history-btn" id="historyBtn" title="History" aria-label="View question history" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3.5 2"/></svg>
      </button>
    </div>
  </header>

  <div class="history-panel" id="historyPanel" aria-hidden="true">
    <div class="history-head">
      <span>History</span>
      <button class="history-clear" id="historyClear">Clear</button>
    </div>
    <div class="history-list" id="historyList"></div>
    <div class="history-empty" id="historyEmpty">Questions you ask will show up here.</div>
  </div>

  <div class="orb-zone">
    <div class="orb-stage">
      <div class="orb-glow" aria-hidden="true"></div>
      <canvas id="orbCanvas" role="button" aria-label="Tap to talk to Fit Partner"></canvas>
      <div class="orb-ring" aria-hidden="true"></div>
    </div>
    <div class="orb-hint" id="orbHint">Tap the orb and ask a question</div>
  </div>

  <div class="messages" id="messages"></div>
  <div class="status" id="status"></div>

  <div class="inputbar">
    <input id="textInput" type="text" placeholder="Ask about exercises, diet, or recovery…" />
    <button class="send" id="sendBtn" title="Send" aria-label="Send message">
      <svg viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
    </button>
  </div>
</div>

<script>
/* ---------------- Config ---------------- */
const BACKEND_URL = 'http://localhost:8000';

/* ---------------- Icon set (inline SVG, no external images/gifs) ---------------- */
const ICONS = {
  chest:   '<circle cx="7" cy="12" r="4"/><circle cx="17" cy="12" r="4"/>',
  back:    '<path d="M12 2v20"/><path d="M6 6h12"/><path d="M6 12h12"/><path d="M6 18h12"/>',
  legs:    '<path d="M9 2v9l-3 11"/><path d="M15 2v9l3 11"/>',
  shoulders: '<circle cx="6" cy="8" r="3"/><circle cx="18" cy="8" r="3"/><path d="M9 8h6"/>',
  biceps:  '<path d="M6 18c0-6 2-10 6-10s6 4 6 10"/><circle cx="12" cy="8" r="3"/>',
  triceps: '<path d="M6 18c0-6 2-10 6-10s6 4 6 10"/>',
  arms:    '<path d="M6 18c0-6 2-10 6-10s6 4 6 10"/><circle cx="12" cy="8" r="3"/>',
  core:    '<rect x="7" y="4" width="10" height="16" rx="2"/><path d="M7 9h10"/><path d="M7 14h10"/>',
  abs:     '<rect x="7" y="4" width="10" height="16" rx="2"/><path d="M7 9h10"/><path d="M7 14h10"/>',
  glutes:  '<circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/>',
  dumbbell:'<rect x="2" y="9" width="4" height="6" rx="1"/><rect x="18" y="9" width="4" height="6" rx="1"/><path d="M6 12h12"/>',
  barbell: '<rect x="1" y="10" width="3" height="4"/><rect x="20" y="10" width="3" height="4"/><path d="M4 12h16"/>',
  bench:   '<path d="M3 14h18"/><path d="M5 14v5"/><path d="M19 14v5"/><path d="M7 14V9a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v5"/>',
  machine: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8"/><path d="M8 13h8"/>',
  bodyweight:'<circle cx="12" cy="5" r="2.5"/><path d="M12 8v8"/><path d="M7 12h10"/><path d="M9 20l3-4 3 4"/>',
  bands:   '<path d="M4 12c4-6 12-6 16 0"/><path d="M4 12c4 6 12 6 16 0"/>',
  cardio:  '<path d="M3 12h4l2-6 4 12 2-6h6"/>',
  default: '<circle cx="12" cy="12" r="8"/>'
};
function iconFor(label){
  const key = Object.keys(ICONS).find(k => label.toLowerCase().includes(k));
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICONS[key || 'default']}</svg>`;
}

/* ---------------- Body map: continuous front/back silhouette, matched muscles light up red ---------------- */
const BODY_NEUTRAL_FRONT = `
  <rect x="45" y="20" width="10" height="9" rx="2"/>
  <rect x="12" y="52" width="9" height="20" rx="3"/><rect x="79" y="52" width="9" height="20" rx="3"/>
  <ellipse cx="16" cy="77" rx="5" ry="6"/><ellipse cx="84" cy="77" rx="5" ry="6"/>
  <rect x="30" y="76" width="40" height="8"/>
  <rect x="30" y="124" width="17" height="8"/><rect x="53" y="124" width="17" height="8"/>
  <ellipse cx="38" cy="172" rx="8" ry="5"/><ellipse cx="62" cy="172" rx="8" ry="5"/>
`;
const BODY_NEUTRAL_BACK = `
  <rect x="45" y="20" width="10" height="9" rx="2"/>
  <rect x="12" y="52" width="9" height="20" rx="3"/><rect x="79" y="52" width="9" height="20" rx="3"/>
  <ellipse cx="16" cy="77" rx="5" ry="6"/><ellipse cx="84" cy="77" rx="5" ry="6"/>
  <rect x="30" y="124" width="17" height="8"/><rect x="53" y="124" width="17" height="8"/>
  <ellipse cx="38" cy="172" rx="8" ry="5"/><ellipse cx="62" cy="172" rx="8" ry="5"/>
`;
const BODY_HEAD = '<circle cx="50" cy="14" r="9"/>';

const BODY_FRONT = [
  { key:'shoulders', d:'M18,24 a8,8 0 1,0 16,0 a8,8 0 1,0 -16,0 Z M66,24 a8,8 0 1,0 16,0 a8,8 0 1,0 -16,0 Z' },
  { key:'chest',     d:'M29,25 q21,-6 42,0 v22 q-21,7 -42,0 Z' },
  { key:'biceps',    d:'M13,29 q9,-2 9,4 v22 q-5,3 -9,0 Z M78,29 q-9,-2 -9,4 v22 q5,3 9,0 Z' },
  { key:'core abs',  d:'M34,50 q16,-4 32,0 v28 q-16,5 -32,0 Z' },
  { key:'quad',      d:'M30,84 q9,-4 17,0 v42 q-9,4 -17,0 Z M53,84 q9,-4 17,0 v42 q-9,4 -17,0 Z' },
  { key:'calv',      d:'M31,131 q7,-3 15,0 v32 q-7,3 -15,0 Z M54,131 q7,-3 15,0 v32 q-7,3 -15,0 Z' }
];
const BODY_BACK = [
  { key:'shoulders', d:'M18,24 a8,8 0 1,0 16,0 a8,8 0 1,0 -16,0 Z M66,24 a8,8 0 1,0 16,0 a8,8 0 1,0 -16,0 Z' },
  { key:'back',      d:'M29,25 q21,-6 42,0 v50 q-21,7 -42,0 Z' },
  { key:'triceps',   d:'M13,29 q9,-2 9,4 v22 q-5,3 -9,0 Z M78,29 q-9,-2 -9,4 v22 q5,3 9,0 Z' },
  { key:'glutes',    d:'M31,76 q19,-5 38,0 v14 q-19,6 -38,0 Z' },
  { key:'hamstring', d:'M30,90 q9,-4 17,0 v34 q-9,4 -17,0 Z M53,90 q9,-4 17,0 v34 q-9,4 -17,0 Z' },
  { key:'calv',      d:'M31,131 q7,-3 15,0 v32 q-7,3 -15,0 Z M54,131 q7,-3 15,0 v32 q-7,3 -15,0 Z' }
];

function bodyFigureSvg(regions, neutralFill, muscles){
  const lower = (muscles || []).map(m => m.toLowerCase());
  const regionPaths = regions.map(r => {
    const hit = r.key.split(' ').some(k => lower.some(m => m.includes(k)));
    return `<path d="${r.d}" class="bodymap-region${hit ? ' hit' : ''}"/>`;
  }).join('');
  return `<svg viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
    <g class="bodymap-neutral">${neutralFill}${BODY_HEAD}</g>
    ${regionPaths}
  </svg>`;
}

function renderBodyMap(muscles){
  if (!muscles || !muscles.length) return '';
  return `
    <div class="bodymap">
      <div class="bodymap-fig">${bodyFigureSvg(BODY_FRONT, BODY_NEUTRAL_FRONT, muscles)}<span class="label">Front</span></div>
      <div class="bodymap-fig">${bodyFigureSvg(BODY_BACK, BODY_NEUTRAL_BACK, muscles)}<span class="label">Back</span></div>
    </div>`;
}

function renderMealPlan(meals){
  if (!meals || !meals.length) return '';
  const rows = meals.map(m => `
    <div class="meal-row">
      <span class="meal-name">${escapeHtml(m.meal||'')}</span>
      <span class="meal-items">${escapeHtml(m.items||'')}</span>
      <span class="meal-cal">${escapeHtml(m.calories||'')}</span>
    </div>`).join('');
  return `<div class="mealplan">${rows}</div>`;
}

/* ---------------- Chat DOM ---------------- */
const messagesEl = document.getElementById('messages');
const statusEl = document.getElementById('status');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const orbHint = document.getElementById('orbHint');
const historyBtn = document.getElementById('historyBtn');
const historyPanel = document.getElementById('historyPanel');
const historyList = document.getElementById('historyList');
const historyClear = document.getElementById('historyClear');

function escapeHtml(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escapeAttr(s){ return s.replace(/"/g,'&quot;'); }
function scrollToBottom(){ messagesEl.scrollTop = messagesEl.scrollHeight; }

function addUserMessage(text){
  const row = document.createElement('div');
  row.className = 'row user';
  row.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
  messagesEl.appendChild(row);
  scrollToBottom();
}
function addTyping(){
  const row = document.createElement('div');
  row.className = 'row coach'; row.id = 'typingRow';
  row.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  messagesEl.appendChild(row); scrollToBottom();
}
function removeTyping(){ document.getElementById('typingRow')?.remove(); }

function addCoachMessage(data){
  const row = document.createElement('div');
  row.className = 'row coach';
  const tags = [
    ...(data.muscles || []).map(m => `<span class="tag muscle">${iconFor(m)}${m}</span>`),
    ...(data.equipment || []).map(e => `<span class="tag equip">${iconFor(e)}${e}</span>`)
  ].join('');
  row.innerHTML = `
    <div class="bubble">
      ${escapeHtml(data.answer || '')}
      ${tags ? `<div class="tags">${tags}</div>` : ''}
      ${renderBodyMap(data.muscles)}
      ${renderMealPlan(data.meals)}
      <button class="replay" data-audio="${data.audio_url || ''}" data-text="${escapeAttr(data.answer || '')}">
        <svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>Replay
      </button>
    </div>`;
  messagesEl.appendChild(row);
  row.querySelector('.replay').addEventListener('click', e => {
    const b = e.currentTarget;
    b.dataset.audio ? playServerAudio(BACKEND_URL + b.dataset.audio) : speakFallback(b.dataset.text);
  });
  scrollToBottom();
}

/* ---------------- History (past questions, stored locally) ---------------- */
const HISTORY_KEY = 'fitpartner_history';
const HISTORY_MAX = 30;

function loadHistory(){
  try{ return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
  catch{ return []; }
}
function saveHistory(items){
  try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(items)); }catch{}
}
function logToHistory(text){
  const items = loadHistory();
  items.unshift({ text, time: Date.now() });
  saveHistory(items.slice(0, HISTORY_MAX));
  renderHistory();
}
function formatHistoryTime(ts){
  const d = new Date(ts);
  const sameDay = d.toDateString() === new Date().toDateString();
  return sameDay ? d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : d.toLocaleDateString();
}
function renderHistory(){
  const items = loadHistory();
  historyPanel.classList.toggle('empty', items.length === 0);
  historyList.innerHTML = items.map((item, i) => `
    <button class="history-item" data-index="${i}">
      <span>${escapeHtml(item.text)}</span>
      <span class="h-time">${formatHistoryTime(item.time)}</span>
    </button>`).join('');
  historyList.querySelectorAll('.history-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = items[Number(btn.dataset.index)];
      closeHistory();
      if (item) sendMessage(item.text);
    });
  });
}
function openHistory(){
  historyPanel.classList.add('open');
  historyPanel.setAttribute('aria-hidden', 'false');
  historyBtn.classList.add('open');
  historyBtn.setAttribute('aria-expanded', 'true');
}
function closeHistory(){
  historyPanel.classList.remove('open');
  historyPanel.setAttribute('aria-hidden', 'true');
  historyBtn.classList.remove('open');
  historyBtn.setAttribute('aria-expanded', 'false');
}
historyBtn.addEventListener('click', e => {
  e.stopPropagation();
  historyPanel.classList.contains('open') ? closeHistory() : openHistory();
});
document.addEventListener('click', e => {
  if (!historyPanel.contains(e.target) && !historyBtn.contains(e.target)) closeHistory();
});
historyClear.addEventListener('click', () => { saveHistory([]); renderHistory(); });
renderHistory();

async function sendMessage(text){
  if (!text.trim()) return;
  addUserMessage(text);
  logToHistory(text.trim());
  textInput.value = '';
  addTyping();
  statusEl.textContent = '';
  try{
    const res = await fetch(`${BACKEND_URL}/ask`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({text})
    });
    if (!res.ok) throw new Error();
    const data = await res.json();
    removeTyping();
    addCoachMessage(data);
    data.audio_url ? playServerAudio(BACKEND_URL + data.audio_url) : speakFallback(data.answer);
  }catch{
    removeTyping();
    statusEl.textContent = 'Could not reach Fit Partner backend — is it running on :8000?';
  }
}
sendBtn.addEventListener('click', () => sendMessage(textInput.value));
textInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(textInput.value); });

/* ---------------- Speech input (mic) ---------------- */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null, listening = false;
if (SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.continuous = false; recognition.interimResults = false; recognition.lang = 'en-US';
  recognition.onresult = e => sendMessage(e.results[0][0].transcript);
  recognition.onerror = e => { statusEl.textContent = 'Mic error: ' + e.error; stopListening(); };
  recognition.onend = () => stopListening();
} else {
  orbHint.textContent = 'Speech recognition not supported — type instead';
}

/* ---------------- Web Audio analysers (drive the 3D orb) ---------------- */
let audioCtx = null, micAnalyser = null, micStream = null, playbackAnalyser = null;
const micData = new Uint8Array(64);
const playbackData = new Uint8Array(64);

function getCtx(){ return audioCtx || (audioCtx = new (window.AudioContext || window.webkitAudioContext)()); }

async function startListening(){
  if (!recognition) return;
  try{
    micStream = await navigator.mediaDevices.getUserMedia({ audio:true });
    const ctx = getCtx();
    const source = ctx.createMediaStreamSource(micStream);
    micAnalyser = ctx.createAnalyser();
    micAnalyser.fftSize = 128;
    source.connect(micAnalyser);
    recognition.start();
    listening = true;
    orbState = 'listening';
    orbHint.textContent = 'Listening…';
  }catch(err){
    statusEl.textContent = 'Mic permission denied';
  }
}
function stopListening(){
  listening = false;
  orbState = 'idle';
  orbHint.textContent = 'Tap the orb and ask a question';
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  micAnalyser = null;
}

function playServerAudio(url){
  const audio = new Audio(url);
  const ctx = getCtx();
  const src = ctx.createMediaElementSource(audio);
  playbackAnalyser = ctx.createAnalyser();
  playbackAnalyser.fftSize = 128;
  src.connect(playbackAnalyser);
  playbackAnalyser.connect(ctx.destination);
  orbState = 'speaking';
  audio.onended = () => { orbState = 'idle'; playbackAnalyser = null; };
  audio.onerror = () => { orbState = 'idle'; playbackAnalyser = null; speakFallback(); };
  audio.play().catch(()=>{ orbState = 'idle'; });
}
function speakFallback(text){
  if (!('speechSynthesis' in window) || !text) { orbState = 'idle'; return; }
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1.02;
  u.onstart = () => orbState = 'speaking';
  u.onend = () => orbState = 'idle';
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

/* ---------------- 3D reactive orb (Three.js) ---------------- */
const canvas = document.getElementById('orbCanvas');
const orbGlow = document.querySelector('.orb-glow');
let orbState = 'idle'; // idle | listening | speaking
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.z = 3.4;
const renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

const geometry = new THREE.IcosahedronGeometry(1, 5);
const basePositions = geometry.attributes.position.array.slice();

const material = new THREE.MeshStandardMaterial({
  color: 0x14161a, emissive: 0x14161a, emissiveIntensity: 0.6,
  roughness: 0.35, metalness: 0.1, flatShading: true
});
const mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);

const wireGeo = new THREE.IcosahedronGeometry(1.03, 2);
const wireMat = new THREE.MeshBasicMaterial({ color:0xC8FF4D, wireframe:true, transparent:true, opacity:0.18 });
const wireMesh = new THREE.Mesh(wireGeo, wireMat);
scene.add(wireMesh);

const PARTICLE_COUNT = 40;
const particleGeo = new THREE.BufferGeometry();
const particlePos = new Float32Array(PARTICLE_COUNT * 3);
const particleBaseAngle = [];
for (let i = 0; i < PARTICLE_COUNT; i++){
  const angle = (i / PARTICLE_COUNT) * Math.PI * 2;
  particleBaseAngle.push(angle);
  const r = 1.55;
  particlePos[i*3]   = Math.cos(angle) * r;
  particlePos[i*3+1] = Math.sin(angle) * r * 0.82;
  particlePos[i*3+2] = (Math.sin(angle*3)) * 0.25;
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
const particleMat = new THREE.PointsMaterial({
  color:0xC8FF4D, size:0.05, transparent:true, opacity:0.5,
  sizeAttenuation:true, blending:THREE.AdditiveBlending, depthWrite:false
});
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const key = new THREE.PointLight(0xffffff, 1.1); key.position.set(3,3,4); scene.add(key);
const rim = new THREE.PointLight(0xC8FF4D, 1.4); rim.position.set(-3,-2,2); scene.add(rim);

function resizeOrb(){
  const size = canvas.clientWidth || 150;
  renderer.setSize(size, size, false);
  camera.aspect = 1; camera.updateProjectionMatrix();
}
new ResizeObserver(resizeOrb).observe(canvas);
resizeOrb();

const COLORS = {
  idle:      new THREE.Color(0x2a2e36),
  listening: new THREE.Color(0xC8FF4D),
  speaking:  new THREE.Color(0x5B7CFA)
};
const CSS_COLORS = { idle:'#8A8F98', listening:'#C8FF4D', speaking:'#5B7CFA' };

let clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  let amp = 0.06 + Math.sin(t*1.4)*0.015;
  let bands = null;
  let level = 0.12;

  if (orbState === 'listening' && micAnalyser){
    micAnalyser.getByteFrequencyData(micData);
    bands = micData;
    amp = 0.08;
    level = bands.reduce((a,b)=>a+b,0) / bands.length / 255;
  } else if (orbState === 'speaking' && playbackAnalyser){
    playbackAnalyser.getByteFrequencyData(playbackData);
    bands = playbackData;
    amp = 0.08;
    level = bands.reduce((a,b)=>a+b,0) / bands.length / 255;
  } else if (orbState === 'speaking'){
    amp = 0.12 + Math.abs(Math.sin(t*6))*0.10;
    level = 0.35 + Math.abs(Math.sin(t*6))*0.25;
  }

  const pos = geometry.attributes.position;
  for (let i = 0; i < pos.count; i++){
    const ix = i*3;
    const bx = basePositions[ix], by = basePositions[ix+1], bz = basePositions[ix+2];
    const len = Math.sqrt(bx*bx+by*by+bz*bz) || 1;
    let disp = 0;
    if (bands){
      const bandIndex = Math.floor(((by/len)+1)/2 * (bands.length-1));
      disp = (bands[bandIndex]/255) * amp;
    } else {
      disp = amp * (0.6 + 0.4*Math.sin(t*2 + i*0.05));
    }
    const scale = 1 + disp;
    pos.setXYZ(i, (bx/len)*len*scale, (by/len)*len*scale, (bz/len)*len*scale);
  }
  pos.needsUpdate = true;
  geometry.computeVertexNormals();

  mesh.rotation.y = t * 0.15;
  wireMesh.rotation.y = -t * 0.1;
  wireMesh.scale.setScalar(1 + Math.sin(t*1.2)*0.01);

  const ppos = particleGeo.attributes.position;
  for (let i = 0; i < PARTICLE_COUNT; i++){
    const angle = particleBaseAngle[i] + t * 0.18;
    let r = 1.5;
    if (bands){
      const bandIndex = Math.floor((i / PARTICLE_COUNT) * (bands.length-1));
      r += (bands[bandIndex]/255) * 0.55;
    } else {
      r += 0.06 * Math.sin(t*2 + i*0.4);
    }
    ppos.setXYZ(i, Math.cos(angle)*r, Math.sin(angle)*r*0.82, Math.sin(angle*3 + t)*0.25);
  }
  ppos.needsUpdate = true;
  particleMat.opacity = orbState === 'idle' ? 0.22 : 0.6;

  const targetColor = COLORS[orbState] || COLORS.idle;
  material.emissive.lerp(targetColor, 0.08);
  material.emissiveIntensity = orbState === 'idle' ? 0.5 : 0.9;
  wireMat.color.lerp(targetColor, 0.08);
  particleMat.color.lerp(targetColor, 0.08);

  document.documentElement.style.setProperty('--glow-o', (0.22 + level*0.55).toFixed(3));
  document.documentElement.style.setProperty('--glow-s', (1 + level*0.35).toFixed(3));
  document.documentElement.style.setProperty('--orb-color', CSS_COLORS[orbState] || CSS_COLORS.idle);

  renderer.render(scene, camera);
}
animate();

canvas.addEventListener('click', () => {
  if (listening) { recognition.stop(); return; }
  if (orbState === 'speaking') return;
  startListening();
});
</script>
</body>
